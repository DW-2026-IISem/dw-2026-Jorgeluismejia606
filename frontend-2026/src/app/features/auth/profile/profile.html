<app-page-header
  title="Mi sesión"
  subtitle="Identidad y permisos efectivos devueltos por el backend."
>
  <button
    pButton
    type="button"
    severity="secondary"
    outlined
    [loading]="refreshing()"
    (click)="refresh()"
  >
    <i pButtonIcon class="pi pi-refresh"></i>
    <span pButtonLabel>Refrescar desde el backend</span>
  </button>
  <button pButton type="button" severity="danger" (click)="logout()">
    <i pButtonIcon class="pi pi-sign-out"></i>
    <span pButtonLabel>Salir</span>
  </button>
</app-page-header>

<div class="grid gap-6 lg:grid-cols-3">
  <p-card header="Usuario" class="block">
    @if (session.user(); as user) {
      <dl class="space-y-2 text-sm">
        <div>
          <dt class="text-slate-500">Usuario</dt>
          <dd class="font-medium">{{ user.username }}</dd>
        </div>
        <div>
          <dt class="text-slate-500">Correo</dt>
          <dd>{{ user.email }}</dd>
        </div>
        <div>
          <dt class="text-slate-500">Roles</dt>
          <dd class="mt-1 flex flex-wrap gap-1">
            @for (role of session.roleNames(); track role) {
              <p-tag [value]="role" severity="info" [rounded]="true" />
            } @empty {
              <span class="text-slate-400">Sin rol</span>
            }
          </dd>
        </div>
      </dl>
    }
  </p-card>

  <div class="rounded-xl border border-slate-200 bg-white lg:col-span-2">
    <p-table
      [value]="session.permissions()"
      [paginator]="session.permissionCount() > 10"
      [rows]="10"
    >
      <ng-template #caption>
        <p class="text-sm font-semibold text-slate-700">
          {{ session.permissionCount() }} permisos efectivos
        </p>
      </ng-template>
      <ng-template #header>
        <tr>
          <th>Método</th>
          <th>Ruta</th>
          <th>Rol</th>
        </tr>
      </ng-template>
      <ng-template #body let-permission>
        <tr>
          <td>
            <p-tag
              [value]="permission.method"
              [severity]="methodSeverity(permission.method)"
              [rounded]="true"
            />
          </td>
          <td>
            <code class="text-xs">{{ permission.path }}</code>
          </td>
          <td class="text-sm text-slate-600">{{ permission.role_name }}</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
