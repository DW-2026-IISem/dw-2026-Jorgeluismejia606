<p-card class="mx-auto block max-w-xl">
  <div class="flex flex-col items-center gap-3 text-center">
    <div
      class="flex h-14 w-14 items-center justify-center rounded-full bg-amber-100 text-amber-600"
    >
      <i class="pi pi-lock text-2xl"></i>
    </div>
    <h1 class="text-xl font-semibold text-slate-900">Acceso denegado</h1>
    <p class="text-sm text-slate-500">
      Tu rol no tiene concedida esta operación. Pide a un administrador que la conceda en
      <strong>Seguridad → Concesiones</strong>.
    </p>
    @if (permission) {
      <div class="w-full rounded-xl bg-slate-900 px-4 py-3 text-left">
        <p class="text-[11px] uppercase text-slate-400">Permiso requerido</p>
        <code class="text-sm text-emerald-300">{{ permission }}</code>
      </div>
    }
    <a pButton routerLink="/dashboard" severity="secondary" outlined>
      <span pButtonLabel>Volver al panel</span>
    </a>
  </div>
</p-card>
