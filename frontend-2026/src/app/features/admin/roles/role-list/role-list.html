<app-page-header
  title="Roles"
  subtitle="Agrupadores de permisos. El nombre no autoriza nada: las concesiones sí."
>
  <ng-container *appHasPermission="'POST /api/roles'">
    <button pButton type="button" (click)="openCreate()">
      <i pButtonIcon class="pi pi-plus"></i><span pButtonLabel>Nuevo rol</span>
    </button>
  </ng-container>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">{{ error() }}</p-message>
}

<div class="overflow-x-auto rounded-xl border border-slate-200 bg-white">
  <p-table [value]="visibleRows()" [loading]="loading()" dataKey="id" tableStyleClass="min-w-2xl">
    <ng-template #caption>
      <div class="flex items-center gap-2">
        <i class="pi pi-search text-slate-400"></i>
        <input
          pInputText
          type="search"
          aria-label="Buscar roles"
          placeholder="Buscar rol…"
          [value]="filter()"
          (input)="filter.set($any($event.target).value)"
          class="w-full"
        />
      </div>
    </ng-template>
    <ng-template #header
      ><tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Estado</th>
        <th class="w-40 text-right">Acciones</th>
      </tr></ng-template
    >
    <ng-template #body let-role>
      <tr>
        <td><p-tag [value]="role.name" severity="info" [rounded]="true" /></td>
        <td class="text-sm text-slate-600">{{ role.description || '—' }}</td>
        <td><app-status-tag [status]="role.status" /></td>
        <td>
          <div class="flex justify-end gap-1">
            <ng-container *appHasPermission="'PATCH /api/roles/:id'">
              <button
                pButton
                type="button"
                text
                rounded
                severity="secondary"
                icon="pi pi-pencil"
                aria-label="Editar rol"
                pTooltip="Editar"
                (click)="openEdit(role)"
              ></button>
            </ng-container>
            <ng-container *appHasPermission="'PATCH /api/roles/:id/deactivate'">
              <button
                pButton
                type="button"
                text
                rounded
                severity="warn"
                icon="pi pi-ban"
                aria-label="Desactivar rol"
                pTooltip="Baja lógica"
                (click)="deactivate(role)"
              ></button>
            </ng-container>
            <ng-container *appHasPermission="'DELETE /api/roles/:id'">
              <button
                pButton
                type="button"
                text
                rounded
                severity="danger"
                icon="pi pi-trash"
                aria-label="Eliminar rol"
                pTooltip="Eliminar"
                (click)="remove(role)"
              ></button>
            </ng-container>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage
      ><tr>
        <td colspan="4"><app-empty-state icon="pi pi-id-card" title="Sin roles" /></td></tr
    ></ng-template>
  </p-table>
</div>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="title()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  styleClass="w-full max-w-lg mx-4"
>
  <app-role-form
    [role]="editing()"
    [saving]="saving()"
    [resetKey]="resetKey()"
    (saved)="save($event)"
    (cancelled)="dialogVisible.set(false)"
  />
</p-dialog>
