<app-page-header
  title="Recursos"
  subtitle="Catálogo de puntos de acceso: par (method, path) con la ruta en patrón."
>
  @for (item of countsByMethod(); track item.method) {
    <p-tag
      [value]="item.method + ' · ' + item.count"
      [severity]="methodSeverity(item.method)"
      [rounded]="true"
    />
  }
  <ng-container *appHasPermission="'POST /api/recursos'">
    <button pButton type="button" (click)="openCreate()">
      <i pButtonIcon class="pi pi-plus"></i><span pButtonLabel>Nuevo recurso</span>
    </button>
  </ng-container>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">{{ error() }}</p-message>
}

<div class="overflow-x-auto rounded-xl border border-slate-200 bg-white">
  <p-table
    [value]="visibleRows()"
    [loading]="loading()"
    [paginator]="visibleRows().length > 15"
    [rows]="15"
    dataKey="id"
    tableStyleClass="min-w-3xl"
  >
    <ng-template #caption>
      <div class="flex flex-col gap-2 sm:flex-row sm:items-center">
        <div class="flex flex-1 items-center gap-2">
          <i class="pi pi-search text-slate-400"></i>
          <input
            pInputText
            type="search"
            aria-label="Buscar recursos"
            placeholder="Buscar por ruta o descripción…"
            [value]="filter()"
            (input)="filter.set($any($event.target).value)"
            class="w-full"
          />
        </div>
        <p-select
          class="sm:w-40"
          [options]="methods"
          optionLabel="label"
          optionValue="value"
          placeholder="Método"
          [showClear]="true"
          [ngModel]="methodFilter()"
          (ngModelChange)="methodFilter.set($event ?? null)"
        />
      </div>
    </ng-template>
    <ng-template #header
      ><tr>
        <th>Método</th>
        <th>Ruta</th>
        <th>Descripción</th>
        <th>Estado</th>
        <th class="w-40 text-right">Acciones</th>
      </tr></ng-template
    >
    <ng-template #body let-resource>
      <tr>
        <td>
          <p-tag
            [value]="resource.method"
            [severity]="methodSeverity(resource.method)"
            [rounded]="true"
          />
        </td>
        <td>
          <code class="text-xs">{{ resource.path }}</code>
        </td>
        <td class="text-sm text-slate-600">{{ resource.description || '—' }}</td>
        <td><app-status-tag [status]="resource.status" /></td>
        <td>
          <div class="flex justify-end gap-1">
            <ng-container *appHasPermission="'PATCH /api/recursos/:id'">
              <button
                pButton
                type="button"
                text
                rounded
                severity="secondary"
                icon="pi pi-pencil"
                aria-label="Editar recurso"
                pTooltip="Editar"
                (click)="openEdit(resource)"
              ></button>
            </ng-container>
            <ng-container *appHasPermission="'PATCH /api/recursos/:id/deactivate'">
              <button
                pButton
                type="button"
                text
                rounded
                severity="warn"
                icon="pi pi-ban"
                aria-label="Desactivar recurso"
                pTooltip="Baja lógica"
                (click)="deactivate(resource)"
              ></button>
            </ng-container>
            <ng-container *appHasPermission="'DELETE /api/recursos/:id'">
              <button
                pButton
                type="button"
                text
                rounded
                severity="danger"
                icon="pi pi-trash"
                aria-label="Eliminar recurso"
                pTooltip="Eliminar"
                (click)="remove(resource)"
              ></button>
            </ng-container>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage
      ><tr>
        <td colspan="5"><app-empty-state icon="pi pi-sitemap" title="Sin recursos" /></td></tr
    ></ng-template>
  </p-table>
</div>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="title()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  styleClass="w-full max-w-xl mx-4"
>
  <app-resource-form
    [resource]="editing()"
    [saving]="saving()"
    [resetKey]="resetKey()"
    (saved)="save($event)"
    (cancelled)="dialogVisible.set(false)"
  />
</p-dialog>
