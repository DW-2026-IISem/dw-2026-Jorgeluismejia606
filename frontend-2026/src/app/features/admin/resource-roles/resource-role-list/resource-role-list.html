<app-page-header
  title="Concesiones rol-recurso"
  subtitle="No existe una entidad Permission: el permiso es la fila (rol, recurso)."
>
  <p-tag [value]="rows().length + ' concesiones'" severity="info" [rounded]="true" />
  <ng-container *appHasPermission="'POST /api/concesiones-rol'">
    <button pButton type="button" (click)="openGrant()">
      <i pButtonIcon class="pi pi-key"></i><span pButtonLabel>Conceder permiso</span>
    </button>
  </ng-container>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">{{ error() }}</p-message>
}

<div class="overflow-x-auto rounded-xl border border-slate-200 bg-white">
  <p-table
    [value]="visibleRows()"
    [loading]="loading()"
    [paginator]="visibleRows().length > 15"
    [rows]="15"
    dataKey="id"
    tableStyleClass="min-w-2xl"
  >
    <ng-template #caption>
      <div class="grid gap-2 sm:grid-cols-[14rem_1fr]">
        <p-select
          [fluid]="true"
          [options]="roles()"
          optionLabel="name"
          placeholder="Filtrar por rol"
          [showClear]="true"
          [ngModel]="roleFilter()"
          (ngModelChange)="roleFilter.set($event ?? null)"
        />
        <input
          pInputText
          type="search"
          aria-label="Buscar concesiones"
          placeholder="Buscar por ruta o método…"
          [value]="filter()"
          (input)="filter.set($any($event.target).value)"
          class="w-full"
        />
      </div>
    </ng-template>
    <ng-template #header
      ><tr>
        <th>Rol</th>
        <th>Método</th>
        <th>Ruta</th>
        <th class="w-24 text-right">Acciones</th>
      </tr></ng-template
    >
    <ng-template #body let-row>
      <tr>
        <td>
          <p-tag
            [value]="row.role?.name ?? 'Rol #' + row.role_id"
            severity="info"
            [rounded]="true"
          />
        </td>
        <td>
          <p-tag
            [value]="row.resource?.method"
            [severity]="methodSeverity(row.resource?.method)"
            [rounded]="true"
          />
        </td>
        <td>
          <code class="text-xs">{{ row.resource?.path }}</code>
        </td>
        <td class="text-right">
          <ng-container *appHasPermission="'PATCH /api/concesiones-rol/:id/deactivate'">
            <button
              pButton
              type="button"
              text
              rounded
              severity="warn"
              icon="pi pi-times"
              aria-label="Retirar permiso"
              pTooltip="Retirar"
              (click)="revoke(row)"
            ></button>
          </ng-container>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage
      ><tr>
        <td colspan="4"><app-empty-state icon="pi pi-key" title="Sin concesiones" /></td></tr
    ></ng-template>
  </p-table>
</div>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  header="Conceder permiso"
  [modal]="true"
  [dismissableMask]="true"
  styleClass="w-full max-w-xl mx-4"
>
  <div class="space-y-4">
    <div>
      <label for="grant-role" class="mb-1 block text-sm font-medium text-slate-700">Rol</label>
      <p-select
        [fluid]="true"
        inputId="grant-role"
        [options]="roles()"
        optionLabel="name"
        placeholder="Selecciona un rol"
        [ngModel]="selectedRole()"
        (ngModelChange)="selectedRole.set($event)"
      />
    </div>
    <div>
      <label for="grant-resource" class="mb-1 block text-sm font-medium text-slate-700"
        >Recurso</label
      >
      <p-select
        [fluid]="true"
        inputId="grant-resource"
        [options]="resources()"
        optionLabel="path"
        [filter]="true"
        filterBy="path,method"
        placeholder="Selecciona un recurso"
        [ngModel]="selectedResource()"
        (ngModelChange)="selectedResource.set($event)"
      >
        <ng-template #selectedItem let-resource>
          <span class="flex items-center gap-2">
            <p-tag
              [value]="resource.method"
              [severity]="methodSeverity(resource.method)"
              [rounded]="true"
            />
            <code class="text-xs">{{ resource.path }}</code>
          </span>
        </ng-template>
        <ng-template #item let-resource>
          <span class="flex items-center gap-2">
            <p-tag
              [value]="resource.method"
              [severity]="methodSeverity(resource.method)"
              [rounded]="true"
            />
            <code class="text-xs">{{ resource.path }}</code>
          </span>
        </ng-template>
      </p-select>
    </div>
    <div class="flex justify-end gap-2 border-t border-slate-100 pt-4">
      <button
        pButton
        type="button"
        severity="secondary"
        outlined
        (click)="dialogVisible.set(false)"
      >
        <span pButtonLabel>Cancelar</span>
      </button>
      <button pButton type="button" [disabled]="!canSave()" [loading]="saving()" (click)="grant()">
        <i pButtonIcon class="pi pi-check"></i><span pButtonLabel>Conceder</span>
      </button>
    </div>
  </div>
</p-dialog>
