<section class="crud">
  <header class="crud-header">
    <div>
      <h1>Usuarios y roles</h1>
      <p>Asigna o retira roles a cada usuario del sistema.</p>
    </div>
    <p-button label="Recargar" icon="pi pi-refresh" [text]="true" (onClick)="load()" />
  </header>

  @if (error()) {
    <p class="crud-error">{{ error() }}</p>
  }

  <p-table [value]="rows()" [loading]="loading()">
    <ng-template #header>
      <tr>
        <th>Usuario</th>
        <th>Correo</th>
        <th>Roles asignados</th>
        <th>Asignar rol</th>
      </tr>
    </ng-template>

    <ng-template #body let-row>
      <tr>
        <td>{{ row.user.username }}</td>
        <td>{{ row.user.email }}</td>
        <td>
          <div class="crud-roles">
            @for (a of row.assigned; track a.id) {
              <span class="crud-role">
                <p-tag [value]="roleName(a)" />
                <p-button
                  icon="pi pi-times"
                  [rounded]="true"
                  [text]="true"
                  severity="danger"
                  size="small"
                  ariaLabel="Retirar rol"
                  (onClick)="remove(a)"
                />
              </span>
            } @empty {
              <span class="crud-muted">Sin roles</span>
            }
          </div>
        </td>
        <td>
          <div class="crud-assign">
            <p-select
              [options]="row.available"
              optionLabel="name"
              optionValue="id"
              placeholder="Elegir rol"
              [ngModel]="selected()[row.user.id] ?? null"
              (ngModelChange)="select(row.user.id, $event)"
              [disabled]="row.available.length === 0"
              appendTo="body"
            />
            <p-button
              label="Asignar"
              icon="pi pi-plus"
              size="small"
              [disabled]="!selected()[row.user.id]"
              (onClick)="assign(row.user.id)"
            />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="4">No hay usuarios registrados.</td>
      </tr>
    </ng-template>
  </p-table>
</section>
